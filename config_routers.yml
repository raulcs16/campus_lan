---
- name: Configure Router Infrastructure Links
  hosts: routers
  gather_facts: no

  tasks:
    - name: Configure WAN and Router-to-Router P2P
      cisco.ios.ios_config:
        lines:
          - description WAN_CONNECTION
          - ip address dhcp
          - no shutdown
        parents: interface Ethernet1/3

    - name: Configure P2P Link between R1 and R2
      cisco.ios.ios_config:
        lines:
          - ip address {{ p2p_neighbor_ip }} {{ p2p_mask }}
          - no shutdown
        parents: interface Ethernet1/0

    - name: Configure Downlinks to CD Switches
      cisco.ios.ios_config:
        lines:
          - description "{{ item.desc }}"
          - ip address {{ item.ip }} 255.255.255.252
          - no shutdown
        parents: "interface {{ item.int }}"
      loop:
        - { int: "Ethernet0/1", desc: "TO_CD1_L1", ip: "{{ cd1_l1_ip }}" }
        - { int: "Ethernet0/2", desc: "TO_CD1_L2", ip: "{{ cd1_l2_ip }}" }
        - { int: "Ethernet1/1", desc: "TO_CD2_L1", ip: "{{ cd2_l1_ip }}" }
        - { int: "Ethernet1/2", desc: "TO_CD2_L2", ip: "{{ cd2_l2_ip }}" }

    - name: Configure OSPF Routing
      cisco.ios.ios_config:
        lines:
          - router ospf {{ ospf_process_id }}
          - router-id {{ router_id }}
          - network 172.16.0.0 0.0.255.255 area 0

    - name: Save Configuration
      cisco.ios.ios_command:
        commands: write memory
...
