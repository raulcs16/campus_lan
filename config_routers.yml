---
- name: Configure Router Infrastructure Links
  hosts: routers
  gather_facts: no

  tasks:
    - name: Enable WAN Interface (DHCP)
      cisco.ios.ios_interfaces:
        config:
          - name: Ethernet1/3
            description: "WAN_CONNECTION"
            enabled: yes

    - name: Set WAN to DHCP
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Ethernet1/3
            ipv4:
              - address: dhcp

    - name: Configure P2P Link between R1 and R2
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Ethernet1/0
            ipv4:
              - address: "{{ p2p_neighbor_ip }} {{ p2p_mask }}"

    - name: Configure EtherChannel Bundles (LACP)
      cisco.ios.ios_lag_interfaces:
        config:
          - name: Port-channel10
            members:
              - member: Ethernet0/1
                mode: active
              - member: Ethernet0/2
                mode: active
          - name: Port-channel20
            members:
              - member: Ethernet1/1
                mode: active
              - member: Ethernet1/2
                mode: active

    - name: Ensure Port-channel Interfaces Exist
      cisco.ios.ios_interfaces:
        config:
          - name: Port-channel10
            enabled: yes
          - name: Port-channel20
            enabled: yes

    - name: Assign IPs to Port-Channels
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Port-channel10
            ipv4:
              - address: "{{ pc10_ip }} 255.255.255.252"
          - name: Port-channel20
            ipv4:
              - address: "{{ pc20_ip }} 255.255.255.252"

    - name: Configure OSPF Routing
      cisco.ios.ios_ospf_interfaces:
        config:
          - name: Port-channel10
            address_family:
              - AFI: ipv4
                process_id: "{{ ospf_process_id }}"
                area: 0
          - name: Port-channel20
            address_family:
              - AFI: ipv4
                process_id: "{{ ospf_process_id }}"
                area: 0

    - name: Save Configuration
      cisco.ios.ios_command:
        commands: write memory
...
