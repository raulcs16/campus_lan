---
- name: Configure Router Infrastructure Links
  hosts: routers
  gather_facts: no

  tasks:
    - name: Configure WAN and Router-to-Router P2P
      cisco.ios.ios_config:
        lines:
          - description WAN_CONNECTION
          - ip address dhcp
          - no shutdown
        parents: interface Ethernet1/3

    - name: Configure P2P Link between R1 and R2
      cisco.ios.ios_config:
        lines:
          - ip address {{ p2p_neighbor_ip }} {{ p2p_mask }}
          - no shutdown
        parents: interface Ethernet1/0

    - name: Configure Downlinks to CD Switches
      cisco.ios.ios_config:
        lines:
          - interface Ethernet0/1
          - description TO_CD1_Link1
          - ip address {{ r1_cd1_eth0_1_ip }} 255.255.255.252
          - no shutdown
          - interface Ethernet0/2
          - description TO_CD1_Link2
          - ip address {{ r1_cd1_eth0_2_ip }} 255.255.255.252
          - no shutdown
          - interface Ethernet1/1
          - description TO_CD2_Link1
          - ip address {{ r1_cd2_eth1_1_ip }} 255.255.255.252
          - no shutdown
          - interface Ethernet1/2
          - description TO_CD2_Link2
          - ip address {{ r1_cd2_eth1_2_ip }} 255.255.255.252
          - no shutdown

    - name: Configure OSPF Routing
      cisco.ios.ios_config:
        lines:
          - router ospf {{ ospf_process_id }}
          - router-id {{ router_id }}
          - network 172.16.0.0 0.0.255.255 area 0

    - name: Save Configuration
      cisco.ios.ios_command:
        commands: write memory
...
