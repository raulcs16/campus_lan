---
- name: Configure Router Infrastructure Links
  hosts: routers
  gather_facts: no

  tasks:
    - name: Enable WAN Interface (DHCP)
      cisco.ios.ios_interfaces:
        config:
          - name: Ethernet1/3
            description: "WAN_CONNECTION"
            enabled: yes

    - name: Set WAN to DHCP
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Ethernet1/3
            ipv4:
              - address: dhcp

    - name: Configure P2P Link between R1 and R2
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Ethernet1/0
            ipv4:
              - address: "{{ p2p_neighbor_ip }} {{ p2p_mask }}"

    - name: Ensure Trunk Interface is Up (e0/1)
      cisco.ios.ios_interfaces:
        config:
          - name: Ethernet0/1
            description: "TRUNK_TO_CD_SWITCHES"
            enabled: yes

    - name: Configure VLAN Sub-interfaces and HSRP
      cisco.ios.ios_config:
        lines:
          # Native for VLAN 10, tagged for others
          - "encapsulation dot1Q {{ item.id }}{{ ' native' if item.id == 10 else '' }}"
          - "ip address {{ item.ip }} {{ item.mask }}"
          # HSRP: VIP is pulled from group_vars/all.yml or cdswitches.yml
          - "standby {{ item.id }} ip {{ hsrp_vips[item.id] }}"
          - "standby {{ item.id }} priority {{ hsrp_priority }}"
          - "standby {{ item.id }} preempt"
        parents: "interface Ethernet0/1.{{ item.id }}"
      loop: "{{ router_subinterfaces }}"

    - name: Save Configuration
      cisco.ios.ios_command:
        commands: write memory
...
