---
- name: Configure CD Switches as L2 Aggregators (RoaS Support)
  hosts: cdswitches
  gather_facts: no

  tasks:
    - name: 1. Ensure VLANs Exist
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ campus_vlans }}"

    - name: 2. Configure Downlink Trunks (To Access)
      cisco.ios.ios_config:
        lines:
          - description {{ item.desc }}
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk native vlan 10
        parents: "interface {{ item.name }}"
      loop: "{{ downlink_ports }}"

    - name: 3. Configure Uplink Trunks (To Routers)
      # These ports (e0/1, e0/2, e1/1, e1/2) are now TRUNKS, not routed ports
      cisco.ios.ios_config:
        lines:
          - description "UPLINK_TO_ROUTER"
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk native vlan 10
        parents: "interface {{ item.name }}"
      loop: "{{ router_links }}"

    - name: 4. Final Save
      cisco.ios.ios_command:
        commands: write memory
