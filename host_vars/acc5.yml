---
# Lobby & Cafe - Public Wall Jacks & WiFi
access_ports:
  - { name: "Ethernet1/1", vlan: 35, desc: "CAFE_PLUG_IN_01" }
  - { name: "Ethernet1/2", vlan: 35, desc: "CAFE_PLUG_IN_02" }

# Special Trunk for the Wireless Access Point
ap_trunks:
  - { name: "Ethernet2/0", native: 10, allowed: "40,45", desc: "LOBBY_AP" }
