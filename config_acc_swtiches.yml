---
- name: Provision Library Access Layer (Bottom-Up)
  hosts: accswitches
  gather_facts: no

  tasks:
    - name: 1. Ensure All Library VLANs Exist
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ campus_vlans }}"

    - name: 2. Force Trunk Encapsulation and Mode (Uplinks)
      cisco.ios.ios_config:
        lines:
          - description {{ item.description }}
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk native vlan 10
        parents: "interface {{ item.name }}"
      loop: "{{ uplink_config }}"

    - name: 3. Configure Local Access Ports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_ports }}"
      when: access_ports is defined

    - name: 4. Apply Port Security & STP Features
      cisco.ios.ios_config:
        lines:
          - description {{ item.desc }}
          - spanning-tree portfast
          - spanning-tree bpduguard enable
        parents: "interface {{ item.name }}"
      loop: "{{ access_ports }}"
      when: access_ports is defined

    - name: 5. Configure WiFi AP Trunks (Force Encapsulation)
      cisco.ios.ios_config:
        lines:
          - description {{ item.desc }}
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk native vlan {{ item.native }}
          - switchport trunk allowed vlan {{ item.allowed }}
        parents: "interface {{ item.name }}"
      loop: "{{ ap_trunks }}"
      when: ap_trunks is defined

    - name: 6. Save Configuration to NVRAM
      cisco.ios.ios_config:
        save_when: always
...
