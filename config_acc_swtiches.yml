---
- name: Provision Library Access Layer
  hosts: accswitches
  gather_facts: no

  tasks:
    - name: 1. Ensure All Library VLANs Exist
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ campus_vlans }}"

    - name: 2a. Configure Uplink Descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
        state: merged
      loop: "{{ uplink_config }}"

    - name: 2b. Configure Uplink Trunks
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: trunk
            trunk:
              native_vlan: 10
        state: merged
      loop: "{{ uplink_config }}"

    - name: 3. Configure Local Access Ports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_ports }}"
      when: access_ports is defined

    - name: 4. Apply Port Security & STP Features
      cisco.ios.ios_config:
        lines:
          - description {{ item.desc }}
          - spanning-tree portfast
          - spanning-tree bpduguard enable
        parents: "interface {{ item.name }}"
      loop: "{{ access_ports }}"
      when: access_ports is defined

    - name: 5a. Configure WiFi AP Descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.desc }}"
        state: merged
      loop: "{{ ap_trunks }}"
      when: ap_trunks is defined

    - name: 5b. Configure WiFi AP Trunking
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: trunk
            trunk:
              native_vlan: "{{ item.native }}"
              allowed_vlans: "{{ item.allowed }}"
        state: merged
      loop: "{{ ap_trunks }}"
      when: ap_trunks is defined

    - name: 6. Save Configuration to NVRAM
      cisco.ios.ios_config:
        save_when: always
...
