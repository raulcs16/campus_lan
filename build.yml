---
- name: Build control enviroment
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: run git pull
      git:
        repo: "https://github.com/raulcs16/campus_lan.git"
        dest: ~/campus_lan
        version: main
        force: yes
      register: git_status

    - name: Update /etc/hosts with network device IPs from inventory
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED CAMPUS NODES"
        block: |
          {% for host in groups['all'] %}
          {% if hostvars[host]['ansible_host'] is defined %}
          {{ hostvars[host]['ansible_host'] }} {{ host }}
          {% endif %}
          {% endfor %}
...
